[project]
name = "backend"
version = "0.1.0"
description = "VLM benchmarking workbench — FastAPI backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.12",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",

    # LangChain / providers
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-google-genai>=2.0",
    "langchain-anthropic>=0.3",
    "langchain-aws>=0.2",
    "langchain-ollama>=0.2",
    "langgraph>=0.2",

    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "greenlet>=3.0",

    # Object storage (S3-compatible)
    "aioboto3>=13.0",

    # Auth
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",

    # Image / templating / misc
    "pillow>=11.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
]
