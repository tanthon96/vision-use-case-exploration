services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vlm
      POSTGRES_PASSWORD: vlm
      POSTGRES_DB: vlm
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Host-side 5433 to avoid conflicting with other local postgres servers.
      # Inside the docker network the backend still reaches `postgres:5432`.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vlm -d vlm"]
      interval: 3s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # Browser fetches of presigned image URLs use crossOrigin="anonymous"
      # (so canvas.toBlob isn't tainted). Without these headers the <img>
      # element silently fails to load — fine for local dev to allow all.
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot to create the bucket on first boot. Exits cleanly when done.
  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    restart: "no"
    entrypoint: >
      sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin >/dev/null 2>&1; do
        echo 'waiting for minio...'; sleep 1;
      done;
      mc mb -p local/vlm-benchmark || true;
      mc anonymous set download local/vlm-benchmark || true;
      echo 'minio bucket ready';
      "

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend:/app/backend
      - ./backend/skills:/app/skills:ro
      - ./data:/data
    ports:
      - "8080:8080"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      minio-setup:
        condition: service_completed_successfully
    environment:
      # Postgres
      DATABASE_URL: postgresql+asyncpg://vlm:vlm@postgres:5432/vlm
      # S3 (MinIO in dev)
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: vlm-benchmark
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
      # Public-facing URL for presigned reads from the browser.
      # In dev the browser hits MinIO directly on localhost:9000.
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      # Skill seed source
      SKILLS_DIR: /app/skills
      # Session signing
      SESSION_SECRET: dev-change-me-in-prod-please
      # Admin bootstrap (only used if users table is empty)
      ADMIN_EMAIL: admin@local
      ADMIN_PASSWORD: admin
      # When true, skip the login screen and run all requests as the admin.
      # Pass `AUTH_DISABLED=true make dev` to turn it on; defaults to false.
      AUTH_DISABLED: ${AUTH_DISABLED:-true}

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_TARGET=http://backend:8080

volumes:
  pgdata:
  miniodata:
